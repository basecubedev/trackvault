services:
  gpx-view:
    build:
      context: .
    image: gpx-view:dev
    ports:
      - "8080:8080"
    environment:
      GPX_VIEW_DATA_DIR: /data
      # The zone month and year boundaries are drawn in. UTC by default, because
      # a container inherits whatever its image carries and the same archive
      # would otherwise report different monthly totals on two machines.
      # GPX_VIEW_TIMEZONE: Europe/Berlin
      #
      # Offline maps are installed through the web interface and stored in the
      # volume below, so there is no tile provider to configure. Set
      # GPX_VIEW_MAPS_ENABLED=false to refuse every map download outright --
      # installed maps keep working.
      # GPX_VIEW_MAPS_ENABLED: "false"
      #
      # Where `gpx-view scan` looks for new files. The directory below is
      # mounted read-only, which is the mount enforcing what the application
      # already promises: nothing in it is written, renamed, moved or deleted.
      GPX_VIEW_IMPORT_DIR: /import
      #
      # Uploading through the web interface writes into the managed archive
      # under /data, never into /import. Set GPX_VIEW_UPLOAD_ENABLED=false to
      # refuse uploads outright -- see README.md, because on a network you do
      # not fully trust this is the setting to think about.
      # GPX_VIEW_UPLOAD_ENABLED: "false"
    volumes:
      # A managed volume, not a host bind mount. Docker initialises a named
      # volume from the image, so /data arrives owned by the non-root runtime
      # user and stays writable without `chmod 777` and without running as root.
      # A bind mount would arrive with the host directory's ownership instead;
      # see README.md for how to use one deliberately.
      #
      # Installed offline maps live here too, so they survive a recreate and
      # never enter the image. They can be hundreds of megabytes each.
      - gpx-view-data:/data
      # Drop files here and run `docker compose exec gpx-view gpx-view scan`.
      # A host directory rather than a volume, because the whole point is that
      # you can put files into it from outside the container. It ships with the
      # repository as an empty folder so that this mount never has to create it:
      # a source Docker creates is owned by root, and you would need sudo to
      # write into the folder that exists for you to write into.
      - ./import:/import:ro
    restart: unless-stopped

volumes:
  gpx-view-data:
