services:
  trackvault:
    # The release number comes from the Git tag, and the build context carries
    # no `.git` -- so an image built from here labels itself `0.0.0+unknown`
    # unless you say otherwise. That is deliberate: this is a development
    # build, and a plausible number would read as a claim it cannot make. Pass
    # one with `docker compose build --build-arg TRACKVAULT_VERSION=1.2.3`.
    build:
      context: .
    image: trackvault:dev
    # 8081 on the host, 8080 in the container. The host side is the one that
    # collides with whatever else the machine runs, so it is the one that is
    # configurable; the container side is fixed and is what the image's health
    # check and `EXPOSE` state. `TRACKVAULT_HTTP_PORT` is the published port and
    # is deliberately not `TRACKVAULT_PORT`, which is the address the application
    # binds *inside* the container -- one name for two ports would make the
    # variable mean whichever one the reader had in mind.
    ports:
      - "${TRACKVAULT_HTTP_PORT:-8081}:8080"
    environment:
      TRACKVAULT_DATA_DIR: /data
      # The zone month and year boundaries are drawn in. UTC by default, because
      # a container inherits whatever its image carries and the same archive
      # would otherwise report different monthly totals on two machines.
      # TRACKVAULT_TIMEZONE: Europe/Berlin
      #
      # Offline maps are installed through the web interface and stored in the
      # volume below, so there is no tile provider to configure. Set
      # TRACKVAULT_MAPS_ENABLED=false to refuse every map download outright --
      # installed maps keep working.
      # TRACKVAULT_MAPS_ENABLED: "false"
      #
      # Where `trackvault scan` looks for new files. The directory below is
      # mounted read-only, which is the mount enforcing what the application
      # already promises: nothing in it is written, renamed, moved or deleted.
      TRACKVAULT_IMPORT_DIR: /import
      #
      # Where `trackvault backup create` writes. Outside /data on purpose: a
      # backup kept inside the directory it protects is deleted with the volume
      # it was meant to survive.
      TRACKVAULT_BACKUP_DIR: /backups
      #
      # Uploading from the browser is on unless you switch it off. It is the
      # one endpoint that lets a caller make the server write, and nothing here
      # authenticates -- so a deployment whose network does not make that
      # acceptable refuses it here. Uploads write into the managed archive
      # under /data, never into /import. See README.md.
      # TRACKVAULT_UPLOAD_ENABLED: "false"
    volumes:
      # A managed volume, not a host bind mount. Docker initialises a named
      # volume from the image, so /data arrives owned by the non-root runtime
      # user and stays writable without `chmod 777` and without running as root.
      # A bind mount would arrive with the host directory's ownership instead;
      # see README.md for how to use one deliberately.
      #
      # Installed offline maps live here too, so they survive a recreate and
      # never enter the image. They can be hundreds of megabytes each.
      - trackvault-data:/data
      # Drop files here and run `docker compose exec trackvault trackvault scan`.
      # A host directory rather than a volume, because the whole point is that
      # you can put files into it from outside the container. It ships with the
      # repository as an empty folder so that this mount never has to create it:
      # a source Docker creates is owned by root, and you would need sudo to
      # write into the folder that exists for you to write into.
      - ./import:/import:ro
      # A managed volume, for the same reason /data is one: this file runs the
      # container as the image's own user, and a host directory would arrive
      # owned by yours. Get a backup out with
      # `docker compose cp trackvault:/backups/<name> .`
      #
      # A user deployment does this the other way round -- bind mount plus
      # PUID/PGID, so backups land straight in a folder you own. See
      # install-docker.sh, and README.md for why the two differ.
      - trackvault-backups:/backups
    restart: unless-stopped

volumes:
  trackvault-data:
  trackvault-backups:
