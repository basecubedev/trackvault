name: CI

on:
  pull_request:
  # The release and edge pipelines call this workflow rather than restating its
  # steps. A release that ran a *copy* of the quality gate would eventually run
  # an older copy, and the gate that matters least is the one nobody looks at.
  #
  # There is deliberately no `push: branches: [main]` here: a commit on main is
  # what the edge pipeline reacts to, and it calls this gate before publishing.
  # Both triggers would run every check on the same commit twice.
  workflow_call:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"
  NODE_VERSION: "24"

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, tags included. The release number is read out of the
          # repository by `hatch-vcs`, and the default shallow fetch brings no
          # tags -- so installing the project would fail for want of a version.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Verify the lock file is up to date
        run: uv lock --check

      - name: Install the project
        run: uv sync --locked --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

      - name: pytest
        run: uv run pytest

      - name: Byte-compile
        run: uv run python -m compileall -q src tests

      # An engineering gate, not legal advice: it fails when a dependency
      # arrives under a licence nobody here has read yet.
      - name: Python dependency licences
        run: uv run python scripts/audit_licenses.py

  frontend:
    name: Browser application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, tags included. The release number is read out of the
          # repository by `hatch-vcs`, and the default shallow fetch brings no
          # tags -- so installing the project would fail for want of a version.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exactly what the lock file resolved
        run: npm ci

      # The backend owns the API. Regenerating the schema and the types here is
      # what stops a hand-edited `TrackResponse` from drifting away from the
      # server it claims to describe: if anything moved, the diff is not empty.
      - name: Regenerate the API types from the backend schema
        run: |
          uv sync --locked --dev --project ..
          npm run generate:api

      # `openapi.json` is not compared, and is not committed either: it states
      # the release it was generated by, and that changes with every commit now
      # that the version comes from the tag. The types are what the browser
      # compiles against and they carry no version, so they are the artifact
      # that can be held still.
      - name: Fail if the generated API types are stale
        run: git diff --exit-code -- src/api/schema.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency licences
        run: npm run licenses

  browser:
    name: End-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, tags included. The release number is read out of the
          # repository by `hatch-vcs`, and the default shallow fetch brings no
          # tags -- so installing the project would fail for want of a version.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked --dev --project ..

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exactly what the lock file resolved
        run: npm ci

      # Chromium only. A browser matrix multiplies the runtime and, for an
      # application this size, tests the same code four times.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the page the tests drive
        run: npm run build

      - name: Playwright
        run: npm run test:e2e

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, tags included. The release number is read out of the
          # repository by `hatch-vcs`, and the default shallow fetch brings no
          # tags -- so installing the project would fail for want of a version.
          fetch-depth: 0

      # The build includes the frontend stage, so a page that does not compile
      # fails the image rather than shipping in it.
      - name: Build the runtime image
        run: docker build --tag trackvault:ci .

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --dev

      - name: Container smoke and persistence tests
        run: uv run pytest -m docker
