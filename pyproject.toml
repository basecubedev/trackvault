[project]
# The distribution, the import package and the console script all derive from
# the product name. One name, and nothing beside it: a command or a module path
# named after something else is a second name to keep true.
name = "trackvault"
# Stated nowhere in this repository: the Git tag is the version, and
# `hatch-vcs` reads it while the wheel is built. A number here would be a
# second authority, and the first tag somebody sets without editing it would
# make one of the two wrong. See
# `tests/contract/test_release_metadata_contract.py`.
dynamic = ["version"]
description = "TrackVault: a self-hosted archive for recorded and planned activity tracks."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # The release contract reads the workflow files structurally -- which events
    # start a release, which job may push. Substring matching on YAML would pass
    # for a trigger that appears in a comment. It arrives transitively through
    # `uvicorn[standard]` anyway; declaring it means the test suite does not
    # silently depend on somebody else's extras.
    "pyyaml>=6.0",
    "ruff>=0.8",
    "types-defusedxml>=0.7",
]

[project.scripts]
trackvault = "trackvault.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
# No fallback version. A build that can see neither a tag nor an explicit
# `SETUPTOOLS_SCM_PRETEND_VERSION` does not know which release it is, and
# failing there is cheaper than shipping an image labelled with a number
# somebody invented. The container build is told; see the Dockerfile.
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/trackvault"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "ANN", # flake8-annotations
    "ARG", # flake8-unused-arguments
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Assertions are the point of a test suite.
"tests/**/*.py" = ["S101"]
# The Docker smoke test deliberately shells out to the `docker` CLI on PATH.
"tests/integration/test_docker_smoke.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
extra_checks = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `tests/support/` holds helpers that build the suite's own inputs -- a valid
# vector tile package, a provider on loopback. They are importable as
# `support.*` rather than through a conftest fixture because several of them
# are constructors, not fixtures, and a fixture that returns a builder is a
# fixture in name only.
pythonpath = ["tests"]
# Docker tests and the local reference regression are opt-in:
# `uv run pytest -m docker`, `uv run pytest -m local_tracks`.
addopts = "--strict-markers --strict-config -ra -m 'not docker and not local_tracks'"
markers = [
    "unit: isolated test of a single unit of behaviour",
    "contract: verifies a documented project or API contract",
    "integration: exercises several components together, still fully local",
    "docker: requires a working local Docker daemon (opt-in)",
    "e2e: drives the application end to end",
    "regression: pins behaviour that was broken before",
    "gpx: exercises the GPX adapter",
    "persistence: exercises the SQLite store or the raw import storage",
    "storage: exercises the managed raw import storage authority",
    "reprocessing: exercises reprocessing and the current normalized generation",
    "analysis: exercises the track analysis algorithms and their versioning",
    "statistics: exercises actual/planned aggregation and the statistics queries",
    "local_tracks: requires private local reference files under ./import-tracks (opt-in)",
    "maps: exercises offline map packages, their delivery and their provider adapters",
]

[tool.coverage.run]
source = ["src/trackvault"]
branch = true

[tool.coverage.report]
show_missing = true
