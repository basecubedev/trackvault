[project]
name = "gpx-view"
version = "0.1.0"
description = "Local web application for managing, analysing and visualising planned and recorded GPS tracks."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpx_view"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "ANN", # flake8-annotations
    "ARG", # flake8-unused-arguments
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Assertions are the point of a test suite.
"tests/**/*.py" = ["S101"]
# The Docker smoke test deliberately shells out to the `docker` CLI on PATH.
"tests/integration/test_docker_smoke.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
extra_checks = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Docker tests are opt-in: `uv run pytest -m docker`.
addopts = "--strict-markers --strict-config -ra -m 'not docker'"
markers = [
    "unit: isolated test of a single unit of behaviour",
    "contract: verifies a documented project or API contract",
    "integration: exercises several components together, still fully local",
    "docker: requires a working local Docker daemon (opt-in)",
    "e2e: drives the application end to end",
    "regression: pins behaviour that was broken before",
]

[tool.coverage.run]
source = ["src/gpx_view"]
branch = true

[tool.coverage.report]
show_missing = true
